name: Validate GitHub-hosted Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: demo-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate committed live demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Rebuild static demo
        run: npm run build:demo
      - name: Verify committed demo is current
        run: git diff --exit-code -- live-demo
